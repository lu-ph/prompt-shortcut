<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>input</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #222222;
            overflow: hidden;
        }
        textarea {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: #ffffff;
            border: none;
            outline: none;
            resize: none;
            padding: 24px;
            box-sizing: border-box;
            font-size: 20px;
            font-family: sans-serif;
        }
        textarea::placeholder {
            color: #777777;
        }
    </style>
</head>
<body>
    <textarea autofocus placeholder="Type something and press Enter..."></textarea>
    <script>
        // Pressing Escape can close the window without returning text
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.close();
            }
        });
    </script>
</body>
</html>
